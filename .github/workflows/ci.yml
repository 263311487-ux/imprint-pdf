name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk

      - name: Install system libs (macOS)
        if: runner.os == 'macOS'
        run: brew install pango

      - name: Install system libs (Windows)
        if: runner.os == 'Windows'
        run: choco install gtk-runtime -y --no-progress

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[charts]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Smoke-render sample
        run: |
          python -m imprint examples/sample.md --no-validate
