[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imprint-pdf"
version = "0.14.0"
description = "AI-native, print-grade Chinese PDF generator: Markdown in, publisher-quality PDF out, with a 0-100 print-quality report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bai Xing (白星)", email = "263311487@qq.com" }]
keywords = ["pdf", "markdown", "chinese", "typography", "weasyprint", "print", "publishing", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Printing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "WeasyPrint>=61",
  "PyYAML>=6.0",
  "Pygments>=2.15",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
charts = ["mermaidx>=0.1"]
mcp = ["mcp>=1.2,<2.0"]

[project.scripts]
imprint = "imprint.cli:main"
imprint-mcp = "imprint.mcp_server:main"

[project.urls]
Homepage = "https://github.com/263311487-ux/imprint-pdf"
Repository = "https://github.com/263311487-ux/imprint-pdf.git"
Issues = "https://github.com/263311487-ux/imprint-pdf/issues"
Changelog = "https://github.com/263311487-ux/imprint-pdf/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["imprint", "imprint.themes"]

[tool.setuptools.package-data]
imprint = ["themes/*.json", "templates/*.md"]
