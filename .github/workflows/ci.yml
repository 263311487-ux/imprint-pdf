name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # GitHub ubuntu runners occasionally hit flaky apt mirrors that can
          # stall indefinitely; every attempt is hard-bounded by `timeout` so a
          # dead mirror fails fast and the retry loop gets a clean shot.
          for i in 1 2 3 4; do
            if timeout 240 sudo apt-get install -y --no-install-recommends \
                -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk; then
              exit 0
            fi
            echo "apt install failed (attempt $i), cleaning lists and retrying..."
            sudo rm -rf /var/lib/apt/lists/*
            timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update || true
            sleep 15
          done
          exit 1

      - name: Install system libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango
          # WeasyPrint loads glib/pango via ctypes; expose Homebrew's lib dir.
          echo "DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib" >> "$GITHUB_ENV"

      - name: Install system libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The chocolatey `gtk-runtime` package ships GTK2 (too old for
          # WeasyPrint); install the official GTK3 runtime instead.
          $url = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\gtk3.exe"
          Start-Process -FilePath "$env:TEMP\gtk3.exe" -ArgumentList "/S" -Wait
          # Put the GTK3 DLLs on PATH so ctypes can find libgobject/pango.
          echo "C:\Program Files\GTK3-Runtime Win64\bin" >> $env:GITHUB_PATH

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[charts,mcp]" pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Smoke-render sample
        run: |
          python -m imprint examples/sample.md --no-validate
